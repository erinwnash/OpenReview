<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 310" width="100%" height="auto" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bgSync" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#1c1c1c"/>
    </linearGradient>
    <marker id="arrowS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4dabf7"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e5a823"/>
    </marker>
  </defs>

  <rect width="1120" height="310" rx="10" fill="url(#bgSync)" stroke="#333333" stroke-width="1.5"/>

  <!-- Left Half: Audio Sync & Drift Compensation -->
  <rect x="20" y="20" width="530" height="270" rx="8" fill="#1b1f24" stroke="#2d3b4e"/>
  <text x="36" y="44" fill="#4dabf7" font-size="13" font-weight="700" letter-spacing="0.6">SUB-FRAME AUDIO SYNCHRONIZATION &amp; DRIFT ENGINE</text>

  <rect x="36" y="62" width="220" height="82" rx="6" fill="#242424" stroke="#e5a823"/>
  <text x="48" y="82" fill="#e5a823" font-size="12" font-weight="700">PlaybackClock (Master)</text>
  <text x="48" y="100" fill="#cccccc" font-size="11">• Emits frame_changed(F)</text>
  <text x="48" y="116" fill="#cccccc" font-size="11">• Emits frame_scrubbed(F)</text>
  <text x="48" y="132" fill="#888888" font-size="10" font-family="monospace">t_video = (F - F_start) / FPS</text>

  <rect x="294" y="62" width="238" height="82" rx="6" fill="#242424" stroke="#4dabf7"/>
  <text x="306" y="82" fill="#4dabf7" font-size="12" font-weight="700">Offset &amp; Drift Calculator</text>
  <text x="306" y="100" fill="#cccccc" font-size="11">• Dual Offset (Sec + Frames)</text>
  <text x="306" y="116" fill="#cccccc" font-size="11">• Drift Check: |t_aud - t_target|</text>
  <text x="306" y="132" fill="#888888" font-size="10" font-family="monospace">Threshold &gt; 45ms → Hard Resync</text>

  <rect x="36" y="168" width="496" height="104" rx="6" fill="#202020" stroke="#555555"/>
  <text x="50" y="190" fill="#69db7c" font-size="12" font-weight="700">QtMultimedia Output &amp; 60ms Scrubbing Burst Generator</text>
  <text x="50" y="210" fill="#cccccc" font-size="11">• Target Position Formula:  pos_ms = ((frame - start_frame - offset_frames) / fps - offset_sec) × 1000</text>
  <text x="50" y="230" fill="#cccccc" font-size="11">• Interactive Timeline/Canvas Drag: Seeks to exact frame timestamp &amp; triggers 60ms QTimer audio burst</text>
  <text x="50" y="250" fill="#cccccc" font-size="11">• Variable Speed / Shuttle Rate Matching: Automatically scales QMediaPlayer playbackRate (0.25x – 4.0x)</text>

  <line x1="256" y1="103" x2="288" y2="103" stroke="#e5a823" stroke-width="2" marker-end="url(#arrowA)"/>
  <line x1="413" y1="144" x2="413" y2="162" stroke="#4dabf7" stroke-width="2" marker-end="url(#arrowS)"/>

  <!-- Right Half: Multi-User Dailies Sync Topology -->
  <rect x="570" y="20" width="530" height="270" rx="8" fill="#211d17" stroke="#4a3b22"/>
  <text x="586" y="44" fill="#e5a823" font-size="13" font-weight="700" letter-spacing="0.6">MULTI-USER REMOTE DAILIES SYNC TOPOLOGY (TCP :9090)</text>

  <rect x="586" y="62" width="215" height="96" rx="6" fill="#242424" stroke="#e5a823" stroke-width="1.5"/>
  <text x="598" y="82" fill="#e5a823" font-size="12" font-weight="700">Host Server / Presenter</text>
  <text x="598" y="100" fill="#cccccc" font-size="11">• QTcpServer (:9090)</text>
  <text x="598" y="116" fill="#cccccc" font-size="11">• Broadcasts Play/Seek/FPS</text>
  <text x="598" y="132" fill="#cccccc" font-size="11">• Broadcasts Strokes &amp; Grades</text>
  <text x="598" y="148" fill="#69db7c" font-size="10" font-family="monospace">Presenter Lock Control</text>

  <rect x="855" y="62" width="228" height="44" rx="5" fill="#242424" stroke="#4dabf7"/>
  <text x="867" y="82" fill="#4dabf7" font-size="11" font-weight="700">Peer Workstation A (Compositor)</text>
  <text x="867" y="97" fill="#aaaaaa" font-size="10">Follow Mode: ON • Live Whiteboard</text>

  <rect x="855" y="114" width="228" height="44" rx="5" fill="#242424" stroke="#4dabf7"/>
  <text x="867" y="134" fill="#4dabf7" font-size="11" font-weight="700">Peer Workstation B (Lead / Sup)</text>
  <text x="867" y="149" fill="#aaaaaa" font-size="10">Follow Mode: ON • Can Take Presenter</text>

  <rect x="586" y="174" width="497" height="98" rx="6" fill="#202020" stroke="#555555"/>
  <text x="600" y="196" fill="#e5a823" font-size="12" font-weight="700">Real-Time Newline-Delimited JSON Event Protocol</text>
  <text x="600" y="216" fill="#cccccc" font-size="11">• Events: PLAYBACK_STATE • MEDIA_LOAD • COLOR_GRADE • STROKE_ADD • ANNOT_CLEAR • NOTE_SET • CHAT</text>
  <text x="600" y="236" fill="#cccccc" font-size="11">• Path Resolution: Auto-matches shot filenames across OS mounts (/shows/... vs Z:\shows\...)</text>
  <text x="600" y="256" fill="#cccccc" font-size="11">• Follow Mode Toggle: Peers can detach locally to inspect a frame and re-sync with one click</text>

  <line x1="801" y1="84" x2="849" y2="84" stroke="#e5a823" stroke-width="2" marker-end="url(#arrowA)"/>
  <line x1="801" y1="136" x2="849" y2="136" stroke="#e5a823" stroke-width="2" marker-end="url(#arrowA)"/>
</svg>
